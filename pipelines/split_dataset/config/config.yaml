global:
  output_root: "../.."
  representation_root: "../../numerical_representation_data"
  reduction_root: "../.."
  seeds_file: "../../general_configs/random_seeds_30.csv"

# Dataset definition and column names used throughout the workflow.
dataset:
  name: "maomao_anti_mammalian_cells"
  representation_dataset: "maomao"
  input_data: "../data/anti_mammalian_cells/sequences.csv"
  sequence_col: "sequence"
  id_col: "id"
  label_col: "label"

# Numerical representations available to representation-dependent strategies.
representations:
  esm2_t6_8M_UR50D:
    method: "sylphy_embedding"
    model_alias: "esm2_t6_8M_UR50D"
    output_name: "esm2_t6_8M_UR50D"
    feature_mode: "embeddings"
    metric: "cosine"

  ankh2_ext1:
    method: "sylphy_embedding"
    model_alias: "ankh2_ext1"
    output_name: "ankh2_ext1"
    feature_mode: "embeddings"
    metric: "cosine"

  ankh3_large:
    method: "sylphy_embedding"
    model_alias: "ankh3_large"
    output_name: "ankh3_large"
    feature_mode: "embeddings"
    metric: "cosine"

  esm2_t12_35M_UR50D:
    method: "sylphy_embedding"
    model_alias: "esm2_t12_35M_UR50D"
    output_name: "esm2_t12_35M_UR50D"
    feature_mode: "embeddings"
    metric: "cosine"

  esm2_t30_150M_UR50D:
    method: "sylphy_embedding"
    model_alias: "esm2_t30_150M_UR50D"
    output_name: "esm2_t30_150M_UR50D"
    feature_mode: "embeddings"
    metric: "cosine"

  esm2_t33_650M_UR50D:
    method: "sylphy_embedding"
    model_alias: "esm2_t33_650M_UR50D"
    output_name: "esm2_t33_650M_UR50D"
    feature_mode: "embeddings"
    metric: "cosine"

  esmc_300m:
    method: "sylphy_embedding"
    model_alias: "esmc_300m"
    output_name: "esmc_300m"
    feature_mode: "embeddings"
    metric: "cosine"

  mistral_prot_v1_134M:
    method: "sylphy_embedding"
    model_alias: "mistral_prot_v1_134M"
    output_name: "mistral_prot_v1_134M"
    feature_mode: "embeddings"
    metric: "cosine"

  prot_bert:
    method: "sylphy_embedding"
    model_alias: "prot_bert"
    output_name: "prot_bert"
    feature_mode: "embeddings"
    metric: "cosine"

  prot_t5_xl_uniref50:
    method: "sylphy_embedding"
    model_alias: "prot_t5_xl_uniref50"
    output_name: "prot_t5_xl_uniref50"
    feature_mode: "embeddings"
    metric: "cosine"

  one_hot:
    method: "sylphy_one_hot"
    model_alias: "one_hot"
    output_name: "one_hot"
    feature_mode: "descriptors"
    metric: "euclidean"
    feature_prefix: "p_"

# Dataset variants that will be partitioned.
split_sources:
  no_reduced:
    enabled: true

  reduced_distance:
    enabled: false
    reductions:
      esm2_t6_8M_UR50D:
        enabled: false
        representation_key: "esm2_t6_8M_UR50D"
        root: "../../reduced_distance/maomao_anti_mammalian_cells/esm2_t6_8M_UR50D_embedding_distance_reduction"
        thresholds: "auto"

  reduced_homology:
    enabled: false
    reductions:
      homology_mmseqs2_reduction:
        enabled: false
        root: "../../reduced_homology/maomao_anti_mammalian_cells/homology_mmseqs2_reduction"
        thresholds: "auto"

  reduced_descriptor:
    enabled: false
    reductions:
      one_hot:
        enabled: false
        representation_key: "one_hot"
        root: "../../reduced_descriptor/maomao_anti_mammalian_cells/one_hot_reduction"
        thresholds: "auto"

# Partitioning methods and their parameters.
split_strategies:
  biosieve_exec: "biosieve"

  random_kfold:
    enabled: true
    n_splits: 5
    shuffle: true
    val_size: 0.1

  stratified_kfold:
    enabled: true
    n_splits: 5
    shuffle: true
    val_size: 0.1
    dropna: true
    cast_to_str: false

  distance_aware_kfold:
    enabled: false
    n_splits: 5
    val_size: 0.1
    shuffle_ties: true
    descriptor_modes:
      - "no_norm"
      # - "norm"

# Representations used by strategies that require numerical features.
cross_features:
  train_representations:
    - "ankh2_ext1"
    - "ankh3_large"
    - "esm2_t6_8M_UR50D"
    - "esm2_t12_35M_UR50D"
    - "esm2_t30_150M_UR50D"
    - "esm2_t33_650M_UR50D"
    - "esmc_300m"
    - "mistral_prot_v1_134M"
    - "prot_bert"
    - "prot_t5_xl_uniref50"
    - "one_hot"

# Permanent and temporary workflow outputs.
output:
  root: "../../split_process"
  include_dataset_folder: true
  materialized_root: "../../split_process_inputs/maomao_anti_mammalian_cells"

# Validation applied before and after split generation.
validation:
  enabled: true
  min_classes: 2
  min_classes_per_split: 2
  required_split_files:
    - "train.csv"
    - "val.csv"
    - "test.csv"
  remove_stale_outputs_before_split: true
  keep_invalid_fold_files: false
  remove_invalid_run_dirs: true

# Optional summary and plotting stage.
analysis:
  enabled: false
  script: "../../notebooks_and_scripts/scripts_for_pipelines/split_summary.py"
  output_dir: null
  summary_dirname: "split_analysis"
  plots:
    fig_format: "png"
    dpi: 300
    cmap: "split_feasibility"
    annotate: true
    include_no_threshold: true

# Cleanup of temporary materialized inputs after workflow completion.
cleanup:
  remove_materialized_inputs: true
